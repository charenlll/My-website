<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="向陈浩文的个人主页 AI 助手提问，了解学习经历、研究方向与项目实践"
    />
    <meta name="theme-color" content="#a85a5a" />
    <title>向我提问 | 陈浩文</title>
    <link rel="stylesheet" href="../css/about2.css?v=20260602-2" />
  </head>

  <body>
    <div class="bg" aria-hidden="true"></div>

    <main class="content">
      <header class="page-header">
        <p class="eyebrow">AI Assistant</p>
        <h1>向我提问</h1>
        <p class="page-lead">
          这是一个基于本站公开资料构建的个人介绍助手。你可以通过 AI
          快速了解我的学习经历、研究方向与项目实践。本次访问最多可以提问 3 次。
        </p>
      </header>

      <div class="chat-card">
        <div class="prompt-section">
          <span>可以试着问：</span>
          <div class="prompt-list">
            <button type="button" data-prompt="请介绍一下你的研究方向">
              研究方向</button
            ><button type="button" data-prompt="你做过哪些软件开发项目？">
              开发项目</button
            ><button type="button" data-prompt="你擅长哪些数据分析方法？">
              分析能力
            </button>
          </div>
        </div>
        <div
          id="chat-window"
          role="log"
          aria-label="对话记录"
          aria-live="polite"
        >
          <!-- Messages rendered dynamically -->
        </div>
        <div class="chat-input">
          <input
            type="text"
            id="user-input"
            placeholder="输入你的问题..."
            aria-label="输入问题"
            autocomplete="off"
          />
          <button type="button" id="send-btn">发送</button>
        </div>
      </div>
    </main>

    <script src="../js/about2.js?v=20260602-2"></script>
    <script src="../js/script.js?v=20260602-2"></script>
  </body>
</html>
